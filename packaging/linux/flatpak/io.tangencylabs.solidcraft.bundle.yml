# Flatpak manifest for the single-file bundle attached to every GitHub release
# (solidcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
# Adapted from PhotoCraft's (storytold/photocraft, Apache-2.0; see ATTRIBUTION.md).
#
# It repackages the release's own Linux tarball (solidcraft-<version>-linux-<arch>.tar.gz, built
# on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no network
# during the build, and the same binaries as the AppImage/deb/rpm. The binaries need glibc >= 2.35
# and load X11, Wayland, xkbcommon and Vulkan at runtime; the runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# The runtime is GNOME 51 (based on freedesktop-sdk 26.08.2, the same base the old
# org.freedesktop.Platform 26.08 pin used) because the Assistant's web view links the system's
# GTK 3 and WebKitGTK 4.1. org.freedesktop.Platform 26.08 ships GTK 3 but no WebKitGTK at all;
# org.gnome.Platform 51 ships both (gnome-build-meta 51.1, elements/sdk-platform.bst, which is
# the stack of the Platform image, contains sdk/gtk+-3.bst and sdk/webkit2gtk-4.1.bst). Using
# the runtime instead of a bundled WebKitGTK module keeps the build network-free and keeps
# WebKit's helpers and data next to the library they belong to.
#
# Earlier releases used the ids ai.storyteller.solidcraft (0.8 until the move to Tangency Labs)
# and ai.storyteller.solvecraft (before 0.8). The Flatpak repository marks both end-of-life with a
# rebase to this one, so `flatpak update` moves existing installs over (packaging/flatpak-site.sh,
# docs/compatibility.md).
id: io.tangencylabs.solidcraft
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: solidcraft
finish-args:
  # Display: Wayland first, with the X11 socket for the XWayland window whose child view hosts
  # the Assistant. `fallback-x11` gives no X11 socket under a Wayland session, so the page could
  # not be embedded there; native Wayland still runs without XWayland. docs/native-wayland.md.
  - --socket=wayland
  - --socket=x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu viewport (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend), so picked
  # files work anywhere without broad filesystem access. Documents is granted so files passed by
  # path (the command line, recent designs) work in the usual place.
  - --filesystem=xdg-documents
  # Compatibility shim (docs/compatibility.md): settings and autosaves of earlier releases, kept
  # under the old app ids, read once on first launch when this app was installed next to the old
  # one instead of replacing it through `flatpak update`.
  - --filesystem=~/.var/app/ai.storyteller.solidcraft:ro
  - --filesystem=~/.var/app/ai.storyteller.solvecraft:ro
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network io.tangencylabs.solidcraft` exposes it to
  # host agents) and home/host filesystem access.
modules:
  - name: solidcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/solidcraft /app/bin/solidcraft
      - install -Dm755 bin/solidcraft-cli /app/bin/solidcraft-cli
      # The old CLI name, forwarding to solidcraft-cli (compatibility shim, docs/compatibility.md).
      - install -Dm755 bin/solvecraft-cli /app/bin/solvecraft-cli
      - install -Dm644 share/applications/io.tangencylabs.solidcraft.desktop /app/share/applications/io.tangencylabs.solidcraft.desktop
      - install -Dm644 share/mime/packages/io.tangencylabs.solidcraft.xml /app/share/mime/packages/io.tangencylabs.solidcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.tangencylabs.solidcraft.metainfo.xml /app/share/metainfo/io.tangencylabs.solidcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/solidcraft /app/share/doc/
      # Application-relative Mastra runtime; absent on architectures that do not advertise it.
      - if [ -d lib/solidcraft ]; then mkdir -p /app/lib && cp -R lib/solidcraft /app/lib/; fi
    sources:
      - type: dir
        path: stage
