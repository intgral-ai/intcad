<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cef-osr-probe</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #1e90ff; }
  body { font: 15px/1.45 system-ui, sans-serif; color: #fff; }
  header { padding: 14px 18px 4px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  #grid { display: flex; gap: 18px; padding: 8px 18px; align-items: flex-start; }
  input { padding: 7px 9px; width: 260px; border-radius: 6px; border: 0; font: inherit; color: #111; }
  #log { margin: 0; padding: 10px 18px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  #swatch { width: 90px; height: 34px; border-radius: 6px; background: #ffffff; border: 1px solid #ffffff55; }
  .row { display: flex; gap: 10px; align-items: center; }
  textarea { padding: 7px 9px; border-radius: 6px; border: 1px solid #ffffff55; font: inherit; color: #111; }
  label { font: inherit; }
  #prose { max-width: 320px; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>CEF accelerated OSR probe</h1>
  <div id="hint">no child window &middot; no GTK &middot; texture comes from OnAcceleratedPaint</div>
</header>
<div id="grid">
  <div class="row">
    <label for="composer">composer</label>
    <input id="composer" placeholder="type here (ASCII or IME)" autocomplete="off">
    <div id="swatch" title="swatch"></div>
    <select id="pick">
      <option>alpha</option><option>beta</option><option>gamma</option><option>delta</option>
    </select>
  </div>
  <div class="row">
    <textarea id="notes" rows="2" placeholder="notes"></textarea>
    <p id="prose">Real prose in the standalone probe, measured as a semantic element.</p>
  </div>
</div>
<div id="__cef_scope_root">
  <button id="__cef_scope_open" type="button">open</button>
  <a id="__cef_scope_target" href="about:blank" target="_blank">blank</a>
  <select id="__cef_scope_select"><option>alpha</option><option>beta</option></select>
  <button id="__cef_scope_fullscreen" type="button">full</button>
  <button id="__cef_scope_dialog" type="button">dialog</button>
  <button id="__cef_scope_devtools" type="button">devtools</button>
  <input id="__cef_scope_ime" placeholder="ime" autocomplete="off">
</div>
<pre id="log" aria-live="polite"></pre>
<script>
  const log = (line) => {
    const el = document.getElementById('log');
    el.textContent += line + '\n';
    document.title = 'probe: ' + line;
  };
  const composer = document.getElementById('composer');
  composer.addEventListener('input', (e) => log('input ' + JSON.stringify(e.target.value)));
  composer.addEventListener('compositionstart', () => log('compositionstart'));
  composer.addEventListener('compositionupdate', (e) => log('compositionupdate ' + JSON.stringify(e.data)));
  composer.addEventListener('compositionend', (e) => log('compositionend ' + JSON.stringify(e.data)));
  addEventListener('keydown', (e) => log('key ' + e.key + (e.ctrlKey ? '+ctrl' : '') + (e.metaKey ? '+meta' : '')));
  addEventListener('mousedown', (e) => log('mousedown ' + e.clientX + ',' + e.clientY));
  addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) >= 1) log('wheel ' + Math.round(e.deltaY));
  }, { passive: true });
  document.addEventListener('copy', () => log('copy event'));
  document.addEventListener('cut', () => log('cut event'));
  document.addEventListener('paste', (e) => {
    const text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
    log('paste event ' + JSON.stringify(text));
  });
  document.getElementById('pick').addEventListener('change', (e) => log('select ' + e.target.value));
  addEventListener('dragover', (e) => { e.preventDefault(); });
  addEventListener('drop', (e) => {
    e.preventDefault();
    const names = Array.from(e.dataTransfer.files || []).map((f) => f.name);
    log('drop ' + JSON.stringify(names));
  });
  // The same fixed test IDs the app's SOLIDCRAFT_ASSISTANT_CEF_TEST_SCOPE hook
  // installs, with the same split, bounded `SCOPE {json}` messages: one small
  // message per action, so no evidence line can be cut mid-object. This page is a
  // standalone probe, not the app's shipped page; its page-level `#swatch` control
  // is fixture-only, while the fixed analytic patches below are test
  // instrumentation shared with the app hook.
  const SCOPE_MAX_TEXT = 480;
  const SCOPE_BUDGET = { rects: 380, rects_extra: 260, fonts: 160, tokens: 340, roles: 300, swatches: 460 };
  const scope = (value, limit) => {
    const text = 'SCOPE ' + JSON.stringify(value);
    const cap = limit || SCOPE_MAX_TEXT;
    log(text.length <= cap && text.length <= SCOPE_MAX_TEXT
      ? text
      : 'SCOPE ' + JSON.stringify({ action: 'scope_oversize', of: value.action, len: text.length }));
  };
  const scopeRect = (id) => {
    const box = document.getElementById(id).getBoundingClientRect();
    return { x: Math.round(box.x), y: Math.round(box.y), w: Math.round(box.width), h: Math.round(box.height) };
  };
  const colour = (element, part) => element ? getComputedStyle(element)[part] : null;
  // Same analytic test patches as the app hook: opaque midtones, not style tokens.
  const SWATCHES = [
    { id: 'mid', css: '#808080' },
    { id: 'blue', css: '#336699' },
    { id: 'warm', css: '#e08040' }
  ];
  const strip = document.createElement('div');
  strip.id = '__cef_scope_swatches';
  strip.style.cssText = 'position:fixed;left:8px;top:8px;z-index:2147483647;display:flex;gap:4px;padding:2px;background:#000';
  const patches = SWATCHES.map((fixture) => {
    const patch = document.createElement('div');
    patch.id = '__cef_scope_swatch_' + fixture.id;
    patch.style.cssText = 'width:20px;height:20px;background:' + fixture.css;
    strip.appendChild(patch);
    return patch;
  });
  document.body.appendChild(strip);
  const scopeReport = () => {
    const html = getComputedStyle(document.documentElement);
    const body = getComputedStyle(document.body);
    const theme = document.documentElement.dataset.intcadTheme || null;
    const label = document.querySelector('label');
    const prose = document.querySelector('p');
    const textarea = document.querySelector('textarea');
    const live = document.querySelector('[aria-live]');
    scope({
      action: 'rects', theme,
      dpr: devicePixelRatio, inner: [innerWidth, innerHeight],
      root: scopeRect('__cef_scope_root'), open: scopeRect('__cef_scope_open'),
      target: scopeRect('__cef_scope_target'),
      select: scopeRect('__cef_scope_select'), ime: scopeRect('__cef_scope_ime')
    }, SCOPE_BUDGET.rects);
    scope({
      action: 'rects_extra', theme,
      dialog: scopeRect('__cef_scope_dialog'),
      devtools: scopeRect('__cef_scope_devtools'),
      fullscreen: scopeRect('__cef_scope_fullscreen')
    }, SCOPE_BUDGET.rects_extra);
    scope({
      action: 'fonts', theme,
      root: parseFloat(html.fontSize),
      prose: prose ? parseFloat(getComputedStyle(prose).fontSize) : null,
      textarea: textarea ? parseFloat(getComputedStyle(textarea).fontSize) : null,
      label: label ? parseFloat(getComputedStyle(label).fontSize) : null
    }, SCOPE_BUDGET.fonts);
    scope({
      action: 'tokens', theme,
      html_background: html.backgroundColor, body_background: body.backgroundColor,
      tokens: {
        background: html.getPropertyValue('--background').trim(),
        background2: html.getPropertyValue('--background-2').trim(),
        border: html.getPropertyValue('--border').trim(),
        accent: html.getPropertyValue('--intcad-accent').trim(),
        selected: html.getPropertyValue('--intcad-selected').trim(),
        foreground: html.getPropertyValue('--foreground').trim()
      }
    }, SCOPE_BUDGET.tokens);
    scope({
      action: 'roles', theme,
      prose: colour(prose, 'color'), label: colour(label, 'color'),
      textarea: colour(textarea, 'color'), live: colour(live, 'color'),
      swatch: colour(document.getElementById('swatch'), 'backgroundColor')
    }, SCOPE_BUDGET.roles);
    scope({
      action: 'swatches', theme, inner: [innerWidth, innerHeight],
      patches: SWATCHES.map((fixture, index) => ({
        css: fixture.css,
        computed: colour(patches[index], 'backgroundColor'),
        rect: scopeRect('__cef_scope_swatch_' + fixture.id)
      }))
    }, SCOPE_BUDGET.swatches);
  };
  document.getElementById('__cef_scope_open').addEventListener('click', () => {
    scope({ action: 'window_open', denied: window.open('about:blank', '_blank', 'noopener') === null });
  });
  document.getElementById('__cef_scope_target').addEventListener('click', () => {
    // A real target=_blank attempt: the app's CEF host reports the popup denial.
    scope({ action: 'target_blank', requested: true });
  });
  document.getElementById('__cef_scope_select').addEventListener('change', (e) => scope({ action: 'select', value: e.target.value }));
  document.getElementById('__cef_scope_fullscreen').addEventListener('click', () => {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen(); }
  });
  document.addEventListener('fullscreenchange', () => scope({ action: 'fullscreen', active: Boolean(document.fullscreenElement) }));
  document.getElementById('__cef_scope_dialog').addEventListener('click', () => {
    scope({ action: 'dialog_current', cancelled: confirm('cef-scope-dialog') === false });
  });
  document.getElementById('__cef_scope_devtools').addEventListener('click', () => {
    scope({ action: 'devtools_entry', denied: window.open('devtools://devtools/bundled/inspector.html') === null });
  });
  scopeReport();
  addEventListener('resize', scopeReport);
  log('loaded ' + innerWidth + 'x' + innerHeight + ' dpr ' + devicePixelRatio);
</script>
</body>
</html>
