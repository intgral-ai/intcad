# Temporary branch-only diagnostic for INT-1454. Delete before integration.
name: INT-1454 targeted diagnostic

on:
  push:
    branches: [fix/int1454-union-fallback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int1454-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: "0"

jobs:
  format:
    name: Format (source-bound)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - name: Format
        run: |
          mkdir -p evidence
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee evidence/fmt.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: int1454-format
          path: evidence/
          if-no-files-found: error

  front-triangle:
    name: Front triangle RED/GREEN
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-tests
          save-if: false
      - name: Front triangle reproductions
        run: |
          mkdir -p evidence
          set -o pipefail
          cargo test -p solidcraft-engine front_triangle_ --locked -- --nocapture 2>&1 | tee evidence/front-triangle.log
      - name: Kernel fallback guards
        if: always()
        run: |
          set -o pipefail
          cargo test -p solidcraft-kernel --lib union_fallback_gate_is_exact_and_fails_closed --locked -- --nocapture 2>&1 | tee evidence/kernel-guard.log
      - name: Kernel history permutation
        if: always()
        run: |
          set -o pipefail
          cargo test -p solidcraft-kernel --lib swapped_history_maps_every_origin_back --locked -- --nocapture 2>&1 | tee evidence/kernel-history.log
      - name: Section role analytic priority
        if: always()
        run: |
          set -o pipefail
          cargo test -p solidcraft-doc --lib section_roles_keep_analytic_ambiguity_over_a_matching_spline_span --locked -- --nocapture 2>&1 | tee evidence/section-roles.log
      - name: Projection overlap roles
        if: always()
        run: |
          set -o pipefail
          cargo test -p solidcraft-doc --lib section_roles_do_not_name_a_wall_from_a_partly_overlapping_projection --locked -- --nocapture 2>&1 | tee evidence/projection-roles.log
      - name: Free-form role sources
        if: always()
        run: |
          set -o pipefail
          cargo test -p solidcraft-doc --lib free_form_role_sources_are_exact_and_ambiguous_or_unmatched_segments_refuse --locked -- --nocapture 2>&1 | tee evidence/free-form.log
      - name: Pre-join loft wall identities
        if: always()
        run: |
          set -o pipefail
          cargo test -p solidcraft-engine --lib front_triangle_pre_join_loft_wall_identities_are_exact_and_resolve --locked -- --nocapture 2>&1 | tee evidence/pre-join-identity.log
      - name: Doc Clippy
        if: always()
        run: |
          set -o pipefail
          cargo clippy -p solidcraft-doc --lib --locked -- -D warnings 2>&1 | tee evidence/clippy-doc.log
      - name: Kernel and engine Clippy
        if: always()
        run: |
          set -o pipefail
          cargo clippy -p solidcraft-kernel -p solidcraft-engine --all-targets --locked -- -D warnings 2>&1 | tee evidence/clippy.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: int1454-diagnostic
          path: evidence/
          if-no-files-found: error
