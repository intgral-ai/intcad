[book]
title = "Intcad"
description = "An open-source parametric 3D CAD application in pure Rust: user guide and developer guide."
authors = ["Intgral"]
language = "en"
src = "src"

[build]
build-dir = "../../target/book"
create-missing = false

[output.html]
# The source repository is private: the published guide has no public repository or edit link.
site-url = "/"
no-section-label = false

[output.html.search]
enable = true

[output.html.redirect]
# Pages included from the repository (CONTRIBUTING.md, docs/*.md) keep their repository-relative
# links; these send them to the right place.
"/dev/mcp.html" = "../guide/mcp.html"
"/dev/docs/oracle.html" = "../oracle.html"
"/dev/README.html" = "https://github.com/tangency-labs/solidcraft/blob/main/README.md"
"/dev/ATTRIBUTION.html" = "https://github.com/tangency-labs/solidcraft/blob/main/ATTRIBUTION.md"
"/dev/AGENTS.html" = "https://github.com/tangency-labs/solidcraft/blob/main/AGENTS.md"
"/dev/ROADMAP.html" = "https://github.com/tangency-labs/solidcraft/blob/main/ROADMAP.md"
