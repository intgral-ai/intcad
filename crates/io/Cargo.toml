[package]
name = "solidcraft-io"
description = "SolidCraft file formats: designs (JSON), STL, OBJ, STEP, IGES, 3MF and glTF, and FreeCAD/Rhino import"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Tests only: preserve frozen legacy DXF byte/error baselines during migration.
dxf-legacy-baseline-tests = []
# Tests only: trust a model cache even when the build has no git commit.
trust-unknown-source = []

[dependencies]
solidcore-ops = { workspace = true }
solidcore-record = { workspace = true }
solidcore-tess = { workspace = true }
solidcraft-color = { workspace = true }
solidcraft-geom = { workspace = true }
solidcraft-kernel = { workspace = true }
solidcraft-doc = { workspace = true }
solidcraft-format = { workspace = true }
# Signed provenance records in a design container (`src/design/provenance.rs`).
ciborium = { workspace = true }
serde_bytes = { workspace = true }
coset = { workspace = true }
ed25519-dalek = { workspace = true }
pgp = { workspace = true }
solidcraft-profile = { workspace = true }
solidcraft-sketch = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
gltf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
# FreeCAD and Rhino import (pure Rust, so the browser build has it too).
cadmpeg-core = { workspace = true }
cadmpeg-ir = { workspace = true }
cadmpeg-registry = { workspace = true }
# Gerber (RS-274X) parsing for PCB import (src/gerber.rs); pure Rust, MIT OR Apache-2.0, and
# gives the full command set (apertures, regions, macros) later slices need for copper layers.
gerber_parser = { version = "0.5.0", default-features = false }
# Exact area of Gerber copper, mask and silkscreen layers (src/gerber_area.rs): closed polylines
# with arc segments and booleans on them; pure Rust, no unsafe, MIT OR Apache-2.0.
cavalier_contours = { version = "0.9.0", default-features = false }

# The model cache's key (build.rs).
[build-dependencies]
sha2 = { workspace = true }

# A plain fsync on Apple network shares and atomic no-clobber Files publication.
[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

# The Trash (src/files.rs): the system's own call, through its safe bindings; both are already in
# the tree through the app. macOS only: Foundation's trash is a desktop Trash, not an iOS API.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL", "FoundationErrors"] }

# Safe MoveFileExW without REPLACE_EXISTING: file, folder and link publication, including FAT.
[target.'cfg(windows)'.dependencies]
atomicwrites = "=0.4.4"

# The computer's name for a design's lock file (src/design_lock.rs; the browser keeps no lock files).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gethostname = { workspace = true }
tempfile = "3.27"
same-file = "1.0.6"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
trash = "5.2.9"

[dev-dependencies]
solidcraft-testkit = { workspace = true }
# The mesh path's stats, built by hand in the export notes' test.
solidcore-tess = { workspace = true }
# Provenance tests sign with a software OpenPGP key, so they need no GnuPG or smartcard.
rand = "0.8"
