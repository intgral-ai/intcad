[package]
name = "cef-osr-poc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Minimal CEF accelerated OSR -> wgpu -> egui feasibility probe"

[[bin]]
name = "cef-osr-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "cef-osr-panel"
path = "src/bin/panel.rs"

[dependencies]
# welding 0.15.0 = CEF 154.5.0 (Chromium 154.0.8037.98), wgpu 30 by default.
# `cef-runtime` is the real CEF integration; without it every producer is a
# pending-wiring stub, which would make a "PASS" meaningless.
welding = { version = "0.15.0", features = ["cef-runtime"] }
wgpu = "30.0.1"
pollster = "0.4"
dpi = "0.1.2"
log = "0.4"
env_logger = "0.11"
# The panel binary: the same egui/eframe generation the production app uses.
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "clipboard",
] }
egui = "0.37.0"
