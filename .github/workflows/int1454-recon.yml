# Temporary private-branch diagnostic for INT-1454 test reconciliation.
# Not part of the deliverable; removed after the evidence run.
name: INT-1454 targeted reconciliation

on:
  push:
    branches: [fix/int1454-recon]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: "0"

jobs:
  targeted:
    name: Owned migration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free unused runner SDKs
        run: bash scripts/ci/free-disk.sh
      - run: scripts/ci/build-jobs.sh
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: int1454-recon
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Run the owned reconciliation tests
        env:
          EXPR: >-
            (package(solidcraft-cli) & (test(=unknown_command_suggests_the_closest_id) | test(=unknown_pending_concepts_preserve_the_open_design_and_output_files) | test(=corpus_designs_replay_from_their_scripts) | test(=joint_comparison_keeps_stored_x_face_and_end_and_normalizes_only_an_absent_x))) |
            (package(solidcraft-io) & test(=legacy_dir::tests::flatpak_twins_do_not_read_upstream_solidcraft_data)) |
            (package(solidcraft-sketch) & test(=text::style_tests::bold_in_a_variable_font_sets_its_weight_axis)) |
            (package(solidcraft-ui-egui) & binary(scenarios) & test(=slot_preview)) |
            (package(solidcraft-ui-egui) & binary(icon_audit) & test(=requested_menu_icons_have_artwork_and_match_manifest)) |
            (package(solidcraft-doc) & (test(=eval::cost_tests::a_tap_marking_searches_only_the_bodies_near_it) | test(=eval::cost_tests::a_tap_marking_still_searches_the_bodies_within_its_reach)))
        run: |
          set -euo pipefail
          cargo nextest list -p solidcraft-cli -p solidcraft-io -p solidcraft-sketch -p solidcraft-ui-egui -p solidcraft-doc \
            --cargo-profile ci --locked --profile ci --ignore-default-filter -E "$EXPR" --message-format json > selection.json
          python3 - <<'PY'
          import json
          d = json.load(open("selection.json"))
          selected = set()
          for binary, suite in d["rust-suites"].items():
              for name, case in suite.get("testcases", {}).items():
                  if case["filter-match"]["status"] == "matches":
                      selected.add(f"{binary}::{name}")
          expected = {
              "solidcraft-cli::run_results::unknown_command_suggests_the_closest_id",
              "solidcraft-cli::run_results::unknown_pending_concepts_preserve_the_open_design_and_output_files",
              "solidcraft-cli::script_roundtrip::corpus_designs_replay_from_their_scripts",
              "solidcraft-cli::script_roundtrip::joint_comparison_keeps_stored_x_face_and_end_and_normalizes_only_an_absent_x",
              "solidcraft-io::legacy_dir::tests::flatpak_twins_do_not_read_upstream_solidcraft_data",
              "solidcraft-sketch::text::style_tests::bold_in_a_variable_font_sets_its_weight_axis",
              "solidcraft-ui-egui::scenarios::slot_preview",
              "solidcraft-ui-egui::icon_audit::requested_menu_icons_have_artwork_and_match_manifest",
              "solidcraft-doc::eval::cost_tests::a_tap_marking_searches_only_the_bodies_near_it",
              "solidcraft-doc::eval::cost_tests::a_tap_marking_still_searches_the_bodies_within_its_reach",
          }
          print(f"matched {len(selected)} tests")
          for test in sorted(selected):
              print(test)
          missing, extra = expected - selected, selected - expected
          assert selected, "expected test set is empty"
          assert not missing and not extra, f"missing={sorted(missing)} extra={sorted(extra)}"
          PY
          set +e
          cargo nextest run -p solidcraft-cli -p solidcraft-io -p solidcraft-sketch -p solidcraft-ui-egui -p solidcraft-doc \
            --cargo-profile ci --locked --profile ci --ignore-default-filter -E "$EXPR" --test-threads 2 > targeted.log 2>&1
          raw=$?
          set -e
          cat targeted.log
          cargo xtask known-failing --junit target/nextest/ci/junit.xml
          exit $raw
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: int1454-targeted-evidence
          path: |
            selection.json
            targeted.log
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7
