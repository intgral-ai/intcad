# Branch-only focused diagnostic for the INT-1454 MCP connect regression. It runs the whole
# `mcp_connect` test file at the reviewed test blob, records the source SHA/toolchain/raw output,
# and is not part of the required gate. Not wired into ci.yml; remove once integration CI covers it.
name: MCP connect focused diagnostic

on:
  push:
    branches: [fix/int1454-mcp-connect]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-connect-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  SOLIDCRAFT_GPU: software
  WGPU_BACKEND: vulkan
  SOLIDCRAFT_REQUIRE_GPU: "1"

jobs:
  mcp-connect:
    name: mcp_connect at ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free unused runner SDKs
        run: bash scripts/ci/free-disk.sh
      - name: Software Vulkan and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libasound2-dev libudev-dev libxkbcommon-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mcp-connect-diagnostic
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Record source, toolchain and assert the reviewed test blob
        run: |
          set -euo pipefail
          reviewed_source_sha=562973ade451a5903ba23adfd97802242d8d120a
          test_path=apps/solidcraft-cli/tests/mcp_connect.rs
          reviewed_test_blob=$(git rev-parse "$reviewed_source_sha:$test_path")
          source_test_blob=$(git hash-object "$test_path")
          {
            echo "source_sha=$GITHUB_SHA"
            echo "reviewed_source_sha=$reviewed_source_sha"
            echo "reviewed_test_blob=$reviewed_test_blob"
            echo "source_test_blob=$source_test_blob"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "ref=$GITHUB_REF"
            rustc -vV
            cargo --version
            cargo nextest --version
          } | tee metadata.txt
          test "$reviewed_test_blob" = "$source_test_blob"
          git merge-base --is-ancestor "$reviewed_source_sha" HEAD
      - name: Run the focused mcp_connect tests (raw output)
        run: |
          set +e
          set -o pipefail
          cargo nextest run -p solidcraft-cli --test mcp_connect --cargo-profile ci --locked --profile ci 2>&1 | tee nextest.log
          raw=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$raw" > nextest.exit
          echo "raw nextest exit: $raw"
          exit "$raw"
      - name: Summarize counts
        if: always()
        run: |
          set -euo pipefail
          {
            echo "=== nextest exit ==="
            cat nextest.exit 2>/dev/null || echo "(no exit file)"
            echo "=== nextest summary ==="
            grep -E 'Summary|Starting [0-9]+ tests|PASS|FAIL' nextest.log || true
            echo "=== named bridge tests ==="
            grep -E 'mcp_connect_serves_before_the_app_runs_and_reaches_it_once_it_does|mcp_without_arguments_finds_the_running_app' nextest.log || true
          } | tee summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-connect-diagnostic-${{ github.sha }}
          path: |
            metadata.txt
            nextest.log
            nextest.exit
            summary.txt
          if-no-files-found: error
